# Production stack. API image is built via `encore build docker` and loaded onto the VM.
# Deploy with: make deploy
#
# Observability: SigNoz Cloud — telemetry flows through otel-collector to SigNoz Cloud.
# Self-hosted SigNoz/ClickHouse stack is in docker-compose.signoz.yml (local dev only).

services:
  # ── API ─────────────────────────────────────────────────────────────────────
  api:
    image: vital-api:latest
    container_name: vital-api
    restart: unless-stopped
    ports:
      - "5080:5080"
    environment:
      ENV: production
      PORT: "5080"
      AUTH_PROVIDER: keycloak
      DATABASE_URL: postgres://vital:${POSTGRES_PASSWORD:-vital_secret}@postgres:5432/vital_signs?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-vital-signs}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-vital-web}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-vital-api-admin}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      JWKS_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM:-vital-signs}/protocol/openid-connect/certs
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      # Supabase — not used in production (Keycloak is the auth provider).
      # Required by Encore's secret mapping; keep empty unless switching auth provider.
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: vital-api
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "0.1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      disable: true

  # ── PostgreSQL + TimescaleDB ────────────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg18
    container_name: vital-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vital_signs
      POSTGRES_USER: vital
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vital_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vital -d vital_signs"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:8.0-alpine
    container_name: vital-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Keycloak (production auth Vault) ────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    container_name: vital-keycloak
    restart: unless-stopped
    command: start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: vital
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-vital_secret}
      # Hostname — full public HTTPS URL; TLS terminated by Nginx on port 443
      KC_HOSTNAME: https://${KEYCLOAK_HOSTNAME}
      KC_HOSTNAME_STRICT: "false"
      # HTTP enabled so Nginx can reach Keycloak over the Docker network
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # Health endpoint on management port (9000)
      KC_HEALTH_ENABLED: "true"
      # Bootstrap admin (KC 26.x names; used only if no admin exists yet)
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-VitalAdmin1!}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 6<>/dev/tcp/127.0.0.1/9000 && printf \"GET /health/ready HTTP/1.0\\r\\nHost: 127.0.0.1\\r\\n\\r\\n\" >&6 && cat <&6' 2>/dev/null | grep -q UP"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 90s

  # ── Nginx (TLS termination for Keycloak) ────────────────────────────────────
  # Terminates HTTPS on port 443 and proxies to Keycloak over internal HTTP.
  # Certificate generated by: scripts/gen-certs.sh (stored in deployments/docker/certs/)
  nginx:
    image: nginx:1.27-alpine
    container_name: vital-nginx
    restart: unless-stopped
    ports:
      - "80:80"    # HTTP → redirect to HTTPS
      - "443:443"  # HTTPS → Keycloak
    volumes:
      - ./nginx/keycloak.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      keycloak:
        condition: service_healthy

  # ── OpenTelemetry Collector ─────────────────────────────────────────────────
  # Receives telemetry from the app, scrubs PHI, exports to SigNoz Cloud.
  # Configure the OTLP exporter endpoint + ingestion key in otel-collector-config.yaml.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.151.0
    container_name: vital-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    environment:
      - SIGNOZ_INGESTION_KEY=${SIGNOZ_INGESTION_KEY}
      - SIGNOZ_OTLP_ENDPOINT=${SIGNOZ_OTLP_ENDPOINT:-ingest.us.signoz.cloud:443}
    ports:
      - "4317:4317"   # OTLP gRPC (app → collector)
      - "4318:4318"   # OTLP HTTP
      - "13133:13133" # health check
    healthcheck:
      disable: true

volumes:
  postgres_data:
  redis_data:
